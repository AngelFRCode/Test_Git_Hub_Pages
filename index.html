<!DOCTYPE html>
<html lang="es">
  <head>
    <meta name="description" content="Un pequeño quiz sobre los nombres de los colores. Tienes que adivinar cómo se llama el color que se muestra.">
    <meta name="author" content="Andrea Kaminski (Kazeheki)">
    <meta name="github" content="kazeheki">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Quiz de Colores</title>

    <style>
      html,
      body {
        margin: 0;
        box-sizing: border-box;
        font-family: Verdana, Geneva, sans-serif;
      }
      .container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        height: 200px;
        width: 100vw;
      }

      h1,
      h2,
      #attempts {
        text-align: center;
        color: white;
        text-shadow: 1px 1px 1px #111111a9, 1px -1px 1px #111111a9,
          -1px 1px 1px #111111a9, -1px -1px 1px #111111a9;
      }

      button {
        height: 50px;
        width: 190px;
        margin: 0 10px;
        cursor: pointer;

        outline: none;
        background: #111;
        border: 2px solid white;
        border-radius: 25px;
        color: white;
        font-size: 22px;
        text-transform: capitalize;
      }
      button:hover {
        background: #333;
      }

      .hidden {
        display: none;
      }

      #end-screen {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2;
        background: linear-gradient(to top right, salmon, lemonchiffon);
      }

      .wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        height: 700px;
      }

      #end-screen div button {
        margin: 0 auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>¿Cómo se llama este color de fondo?</h1>
      <h2 id="score">Puntuación</h2>
      <h3 id="attempts"></h3>
      <div class="container">
        <button id="answer-1">a</button>
        <button id="answer-2">b</button>
        <button id="answer-3">c</button>
      </div>
    </div>

    <div id="end-screen" class="hidden">
      <div class="wrapper">
        <h1>¡Felicidades!</h1>
        <h2 name="score"></h2>
        <button onclick="reset()">Reiniciar</button>
      </div>
    </div>

    <script>
      // Los valores CSS (izquierda) no se tocan porque el navegador los necesita

      // solo lo que se ve en los botones.

        ],

          "gold",
          "orange",
          "orangered",

          "chocolate",
          "peru",
          "sandybrown",
          "sienna"
        ],
        yellows: [

          "papayawhip",
          "moccasin",
          "peachpuff",
          "khaki",
          "yellow",
          "lightgoldenrodyellow",
          "palegoldenrod",
          "goldenrod",
          "darkgoldenrod",
          "tan",
          "lightyellow"
        ],
        greens: [
          "lawngreen",
          "chartreuse",
          "limegreen",
          "lime",
          "forestgreen",
          "green",
          "yellowgreen",
          "greenyellow",
          "springgreen",
          "seagreen",
          "olive",
          "darkgreen",
          "darkolivegreen",
          "darkseagreen",
          "mediumseagreen",
          "mediumspringgreen",
          "palegreen",
          "lightgreen",
          "mediumaquamarine",
          "darkkhaki",
          "olivedrab",
          "honeydew"
        ],
        cyans: [
          "cyan",
          "aqua",
          "aquamarine",
          "paleturquoise",
          "turquoise",
          "lightseagreen",
          "teal",
          "cadetblue",
          "darkcyan",
          "darkturquoise",
          "mediumturquoise",
          "lightcyan",
          "darkslategray",
          "azure"
        ],
        blues: [
          "powderblue",
          "lightskyblue",
          "deepskyblue",
          "dodgerblue",
          "cornflowerblue",
          "steelblue",
          "royalblue",
          "blue",
          "darkblue",
          "navy",
          "midnightblue",
          "mediumslateblue",
          "slateblue",
          "darkslateblue",
          "lightblue",
          "lightslategray",
          "lightsteelblue",
          "mediumblue",
          "skyblue",
          "slategray"
        ],
        purples: [
          "lavender",
          "thistle",
          "plum",
          "violet",
          "orchid",
          "fuchsia",

          "blueviolet",
          "purple",
          "indigo",
          "darkorchid",
          "darkviolet",
          "darkmagenta",
          "mediumorchid",
          "mediumpurple",
          "rebeccapurple"
        ],
        pinks: [
          "pink",

      };

      const traducciones = {

        tomato: "tomate",
        gold: "dorado",
        orange: "naranja",
        orangered: "rojo anaranjado",
        darkorange: "naranja oscuro",
        chocolate: "chocolate",
        peru: "marrón anaranjado",
        sandybrown: "marrón arena",
        sienna: "siena",
        lemonchiffon: "amarillo pastel",
        papayawhip: "blanco papaya",
        moccasin: "mocasín",
        peachpuff: "melocotón claro",
        khaki: "caqui",
        yellow: "amarillo",
        lightgoldenrodyellow: "amarillo dorado pálido",
        palegoldenrod: "dorado pálido",
        goldenrod: "dorado intenso",
        darkgoldenrod: "dorado oscuro",
        tan: "beige tostado",
        lightyellow: "amarillo claro",
        lawngreen: "verde césped",

        azure: "azur",
        powderblue: "azul polvo",
        lightskyblue: "azul cielo claro",
        deepskyblue: "azul cielo intenso",
        dodgerblue: "azul dodger",
        cornflowerblue: "azul aciano",
        steelblue: "azul acero",

        magenta: "magenta",
        blueviolet: "violeta azulado",
        purple: "púrpura",
        indigo: "índigo",
        darkorchid: "orquídea oscuro",
        darkviolet: "violeta oscuro",
        darkmagenta: "magenta oscuro",
        mediumorchid: "orquídea medio",
        mediumpurple: "púrpura medio",
        rebeccapurple: "púrpura rebecca",
        pink: "rosa",
        lightpink: "rosa claro",
        hotpink: "rosa intenso",
        deeppink: "rosa profundo",
        palevioletred: "rojo violáceo pálido",
        mediumvioletred: "rojo violáceo medio",
        mistyrose: "rosa brumoso",
        lavenderblush: "rosa lavanda",
        lightsalmon: "salmón claro",
        rosybrown: "marrón rosado"
      };

      var body = document.getElementsByTagName("body")[0];
      var scoreElem = document.getElementById("score");
      var attemptsElem = document.getElementById("attempts");
      var endScreen = document.getElementById("end-screen");
      var score = 0;
      var attempts = 0;
      var maxAttempst = 10;

      Array.from(
        document
          .getElementsByClassName("container")[0]
          .getElementsByTagName("button")
      ).forEach(button => {
        button.addEventListener("click", event => {
          if (body.dataset["value"] == event.target.dataset["value"]) {
            score++;
          }
          attempts++;

          if (attempts >= maxAttempst) {
            showEndScreen();
          } else {
            doRound();
          }
        });
      });

      function reset() {
        score = 0;
        attempts = 0;
        updateDisplays();
        endScreen.classList.add("hidden");
      }

      function showEndScreen() {
        endScreen.classList.remove("hidden");
        endScreen.children.item(0).children.namedItem("score").innerHTML =
          "Acertaste " + score + " de " + maxAttempst;
      }

      function updateDisplays() {
        scoreElem.innerHTML = "Puntuación: " + score + "/" + maxAttempst;
        attemptsElem.innerHTML = "Intentos: " + attempts;
      }

      function randomNumberBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function setButton(id, val) {
        var button = document.getElementById("answer-" + id);
        button.innerHTML = traducciones[val] || val;
        button.dataset["value"] = val;
      }

      function getRandomProperty(obj) {
        var keys = Object.keys(obj);
        return obj[keys[(keys.length * Math.random()) << 0]];
      }

      function setRandomBackgroundColor() {
        var colorType = getRandomProperty(colors);
        var colorPos = randomNumberBetween(0, colorType.length - 1);

        body.style.background = colorType[colorPos];
        body.dataset["value"] = colorType[colorPos];

        return [colorType, colorPos];
      }

      function doRound() {
        updateDisplays();
        var [colorType, colorPos] = setRandomBackgroundColor();

        var correctAnswerButton = randomNumberBetween(1, 3);
        setButton(correctAnswerButton, colorType[colorPos]);
        var buttonIds = [1, 2, 3];
        var possibleVals = Array.from(
          Array(colorType.length),
          (x, index) => index
        ).filter(v => v != colorPos);
        buttonIds
          .filter(bi => bi != correctAnswerButton)
          .forEach(bi => {
            var otherColorPos = getRandomProperty(possibleVals);
            setButton(bi, colorType[otherColorPos]);
            possibleVals = possibleVals.filter(v => v != otherColorPos);
          });
      }

      doRound();
    </script>

</html>
